services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: vpn-web
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: file:/runtime/data/app.db
      RUNTIME_DIR: /runtime
    volumes:
      - ../runtime:/runtime
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    image: nginx:1.27-alpine
    container_name: vpn-nginx
    depends_on:
      - web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../runtime/letsencrypt:/etc/letsencrypt
      - ../runtime/acme-webroot:/var/www/certbot

  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: sing-box
    restart: unless-stopped
    network_mode: host
    command: ["run", "-c", "/etc/sing-box/config.json"]
    volumes:
      - ../runtime/generated/sing-box.json:/etc/sing-box/config.json
      - ../runtime/letsencrypt:/etc/letsencrypt
